# Central configuration for the NIDS project.
# Nothing in src/ or scripts/ should hardcode paths — everything reads from here.

project:
  name: NIDS
  student: Krishkumar (2401CS83)

dataset:
  # ASSUMPTION: CICIDS2017, using the smaller daily CSV subsets rather than the full dump.
  # If CICIDS2017 gives you trouble on Day 1, switch this to "NSL-KDD" — see README.
  name: CICIDS2017
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  # CICIDS2017 CSVs use "Label" as the class column, but some mirrors have a
  # leading space (" Label"). load_dataset.py strips whitespace from all
  # column names, so "Label" is enough here.
  target_column: Label

reports:
  figures_dir: reports/figures
  metrics_dir: reports/metrics
  eda_report_md: reports/EDA_REPORT.md
  eda_summary_json: reports/eda_summary.json

analysis:
  correlation_threshold: 0.90   # pairs at or above this are reported as "highly correlated"
  top_correlated_pairs: 25      # cap on how many pairs to list/plot
  top_features_to_plot: 6       # numeric features to show distribution plots for

logging:
  level: INFO
  log_file: logs/nids.log

preprocessing:
  test_size: 0.20
  random_state: 42
  drop_leakage_columns: true
  drop_correlated_features: true
  correlation_threshold: 0.90
  balancing_method: smote         # smote | class_weight | none
  smote_k_neighbors: 5
  artifact_path: models/preprocessing_pipeline.joblib
  processed_dir: data/processed
  interim_dir: data/interim
  summary_path: reports/metrics/preprocessing_summary.json

training:
  models_to_train: [random_forest, xgboost]
  selection_metric: macro_f1        # macro_f1 | weighted_f1 | accuracy
  random_state: 42
  max_train_rows: null              # e.g. 300000 to subsample if training is too slow / out of memory
  save_all_models: false            # true also saves random_forest.pkl and xgboost.pkl (can be large)
  model_path: models/model.pkl
  metrics_path: reports/metrics/model_metrics.json
  report_path: reports/MODEL_REPORT.md
  random_forest:
    n_estimators: 100
    max_depth: null
  xgboost:
    n_estimators: 100
    max_depth: 8
    learning_rate: 0.1

api:
  host: 127.0.0.1
  port: 8000
  benign_label: BENIGN
  db_path: logs/predictions.db
  max_batch_size: 1000

replay:
  interval_seconds: 0.5
  default_count: 200
  shuffle: true
  random_state: 42
  summary_path: reports/metrics/replay_session_summary.json

dashboard:
  port: 8501
  recent_predictions_limit: 100
  refresh_interval_seconds: 3